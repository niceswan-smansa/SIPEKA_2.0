name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:dependency-policy
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run test:migration-policy
      - run: npm run test:assets
      - run: npm run test:pwa
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: phase1-public-build-canary
          SUPABASE_SERVICE_ROLE_KEY: phase1-server-only-bundle-canary
      - run: npm run test:bundle
        env:
          SUPABASE_SERVICE_ROLE_KEY: phase1-server-only-bundle-canary

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run db:types:check
      - if: always()
        run: npx supabase stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx supabase start

      - name: Chromium functional suite
        run: |
          npm run db:reset
          node tools/refresh-local-gateway.mjs
          npm run seed:test-users
          npm run probe:test-auth
          npm run test:auth-policy
          npm run test:e2e

      - name: Firefox and WebKit read-only smoke
        env:
          PLAYWRIGHT_BASE_URL: https://localhost:3443
          PLAYWRIGHT_WEBSERVER_COMMAND: node tools/run-local-next-production.mjs start
          PLAYWRIGHT_WEBSERVER_URL: https://localhost:3443
        run: |
          npm run db:reset
          node tools/refresh-local-gateway.mjs
          npm run seed:test-users
          npm run probe:test-auth
          npm run test:auth-policy
          node tools/run-local-next-production.mjs build
          npm run test:e2e:cross-browser

      - name: Authenticated performance smoke
        env:
          PERF_CONCURRENCY: "4"
          PERF_P95_MS: "10000"
          PERF_ROUNDS: "2"
          PLAYWRIGHT_BASE_URL: https://localhost:3443
          PLAYWRIGHT_WEBSERVER_COMMAND: node tools/run-local-next-production.mjs start
          PLAYWRIGHT_WEBSERVER_URL: https://localhost:3443
        run: |
          npm run db:reset
          node tools/refresh-local-gateway.mjs
          npm run seed:test-users
          npm run probe:test-auth
          npm run test:auth-policy
          node tools/run-local-next-production.mjs build
          npm run test:performance

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          retention-days: 7
      - if: always()
        run: npx supabase stop
